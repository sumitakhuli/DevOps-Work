name: Calculator CI/CD

# Trigger: every push / PR to main runs CI. Only a push to main runs CD.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: calculator-api
  # Local registry used for this demo (registry:2 on localhost:5001).
  # On GitHub this would be ghcr.io/<user> or docker.io/<user>.
  REGISTRY: localhost:5001

jobs:
  # ---------------- CI ----------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check for committed secret files
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep .; then
            echo "Sensitive file found - failing the pipeline."
            exit 1
          fi
          echo "No .env / .pem / .key files found."

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build application
        run: ./build.sh

      - name: Show build info
        run: cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/

  # ---------------- CD ----------------
  docker:
    name: Docker Build & Push
    needs: [build, security-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t ${{ steps.meta.outputs.image }} .

      - name: Push image to registry
        run: docker push ${{ steps.meta.outputs.image }}

  deploy:
    name: Deploy to Staging
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Use the deploy secret
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "DEPLOY_TOKEN secret missing"; exit 1; fi
          echo "Authenticating deploy with token: $DEPLOY_TOKEN"

      - name: Deploy container
        run: |
          docker rm -f calculator-staging 2>/dev/null || true
          docker run -d --name calculator-staging -p 8085:5000 ${{ needs.docker.outputs.image }}

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8085/health && break
            sleep 2
          done
          echo
          curl -sf "http://localhost:8085/api/multiply?a=6&b=7"

# Minimal nginx server config for the bind-mount demo.
#
# sendfile off  is the important line.
# With sendfile on (the default), nginx hands the file to the kernel
# using its cached size. On Docker Desktop the bind mount goes through
# a virtio-fs/gRPC-FUSE layer, so after editing the file on the host
# nginx can serve the NEW bytes with the OLD length, which truncates
# the response. Turning sendfile off makes nginx read the file normally.
server {
    listen 80;
    server_name localhost;

    sendfile off;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
